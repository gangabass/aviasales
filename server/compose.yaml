services:
  aviasales-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3003
      DATA_DIR: /data
    volumes:
      - aviasales-data:/data
    networks:
      - dnevnik-proxy
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  aviasales-data:
networks:
  dnevnik-proxy:
    external: true
